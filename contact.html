<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="./contact.css">
</head>
<body>
    <header>
         <nav class="navbar">
            <div class="logo">Brewé.</div>
            <div id = "contact" >
                
                <a href="./index.html">HOME</a> 
                <a href="./menu2.html">MENU</a>
                <a href="./about.html">ABOUT </a>
                <a href="./contact.html">CONTACT</a>
            </div>  
    
            <button id="order" onclick="window.location.href='./menu2.html'">Order Now</button>
        </nav>
    </header>
    <div class="brew">
            <h1>Contact Brewé</h1>
            <p>We'd love to hear from you </p>
        </div>
    <div class="info">
        
        <div class="contact" >
           
                <div class="detail">
                    <h3>Visit Us</h3>
                    <p>123 Coffee Street, Lucknow</p>
                </div>

                <div class="detail">
                    <h3>Call Us</h3>
                    <p>+91 XXXXXXXXXX</p>
                </div>

                <div class="detail">
                    <h3>Email</h3>
                    <p>hello@brewe.com</p>
                </div>

                <div class="detail">
                    <h3>Opening Hours</h3>
                    <p>Mon-Sun: 8:00 AM - 9:00 PM</p>
                </div>
        </div>
        <div class="form" >
            <form>
                <label for="fname">Full name :</label>
                <br>
                <input type="text" id="fname" name="fname">
                <br>
                <label for="email">Email :</label>
                <br>
                <input type="email" id="email" name="email">
                <br>
                <label for="sub">Subject:</label>
                <br>
                <input type="text" id="sub" name="sub">
                <br>

                <label for="message">Message:</label>
                <br>
                <textarea id="message" name="message" rows="5"></textarea>
                <br><br>

                <button type="submit">Send Message</button>


            </form>
        </div>

    </div>
</body>
</html>
